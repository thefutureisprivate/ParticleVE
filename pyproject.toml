[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "particleve"
version = "45.0.2.6"
description = "ParticleVE image build and verification tools"
requires-python = ">=3.14"
license = "LGPL-2.1-or-later"

[tool.setuptools]
package-dir = {"" = "Sources"}
packages = ["particleve"]

[tool.setuptools.package-data]
particleve = ["runtime-policy.json"]

[tool.ruff]
target-version = "py314"
line-length = 110
src = ["Sources", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["particleve", "Tools", "Tests"]

name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install source-check tools
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements.txt
      - name: Lint and unit tests
        run: make check
      - name: Verify upstream pins and downstream patches
        run: make check-upstream
      - name: Resolve and verify image configuration
        run: make summary

  build-source:
    needs: source-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: build-source
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Compare system inputs with the last selected build
        id: build-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Sources:.
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/build" --jq .object.sha)
          python3 Tools/build_source.py --base "$base" --candidate "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Publish source-version releases
        if: steps.build-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Sources:.
        run: python3 Tools/source_releases.py --repository "$GITHUB_REPOSITORY" --publish
      - name: Advance the checked OBS build ref
        if: steps.build-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/build" \
            -f sha="$GITHUB_SHA" -F force=false

name: Source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact candidate commit for a generated kernel-source PR
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: source-checks-${{ inputs.source_commit || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:fa773d10382c082ff2cccaf7982a5c162f11f296f91274b994357f2d3d473770
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Validate a dispatched candidate identity
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ -n "$SOURCE_COMMIT" && ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be an immutable Git commit' >&2
            exit 1
          fi
      - name: Install native build and test tools
        run: >-
          dnf install --assumeyes git make gcc libselinux-devel python3 python3-pip
          gnupg2 openssl openssh-clients ca-certificates cpio tar xz zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rust_version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          dnf install --assumeyes "rust-${rust_version}" "cargo-${rust_version}" \
            "rustfmt-${rust_version}" "clippy-${rust_version}"
      - name: Install source-check tools
        run: |
          python3 -m venv /tmp/particleve-ci-python
          /tmp/particleve-ci-python/bin/python3 -m pip install \
            --require-hashes --only-binary=:all: -r .github/requirements.txt
          echo '/tmp/particleve-ci-python/bin' >> "$GITHUB_PATH"
      - name: Lint and unit tests
        run: make check
      - name: Verify upstream pins and downstream patches
        run: make check-upstream
      - name: Resolve and verify image configuration
        run: make summary

  report-candidate:
    needs: source-checks
    if: always() && github.event_name == 'workflow_dispatch' && inputs.source_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      # This job has write authority, so use the trusted workflow's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Report the result on the exact candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Sources:.
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHECK_RESULT: ${{ needs.source-checks.result }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from Tools.kernel_updates import report_check
          report_check(os.environ["GITHUB_REPOSITORY"], os.environ["SOURCE_COMMIT"],
                       os.environ["CHECK_RESULT"], os.environ["CHECK_URL"])
          PY

  build-source:
    needs: source-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:fa773d10382c082ff2cccaf7982a5c162f11f296f91274b994357f2d3d473770
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: build-source
      cancel-in-progress: false
    steps:
      - name: Install native publication tools
        run: dnf install --assumeyes git python3 gh cpio tar xz zstd ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize the runner-owned checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compare system inputs with the last selected build
        id: build-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Sources:.
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/build" --jq .object.sha)
          python3 Tools/build_source.py --base "$base" --candidate "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Prepare locked dependency sources
        if: steps.build-inputs.outputs.changed == 'true'
        env:
          PYTHONPATH: Sources:.
        run: |
          rust_version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          dnf install --assumeyes "rust-${rust_version}" "cargo-${rust_version}"
          python3 Tools/prepare-obs.py --tree "$GITHUB_SHA"
      - name: Publish source-version releases
        if: steps.build-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Sources:.
        run: >-
          python3 Tools/source_releases.py --repository "$GITHUB_REPOSITORY" --publish
          --vendor-archive build/obs-packages/particleve/vendor.tar.zst
      - name: Advance the checked OBS build ref
        if: steps.build-inputs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/build" \
            -f sha="$GITHUB_SHA" -F force=false

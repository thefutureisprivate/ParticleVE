# Native headless profile for the ParticleVE fork.
[Config]
MinimumVersion=27.1

[Distribution]
Distribution=fedora
Release=45
Architecture=x86-64
RepositoryKeyCheck=yes

[Build]
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=45
ToolsTreeProfiles=
ToolsTreeProfiles=runtime,misc

[Output]
ImageId=ParticleVE
Output=ParticleVE_%v_%a
SplitArtifacts=uki,partitions,os-release,roothash,initrd
ManifestFormat=json

[Content]
UnifiedKernelImageFormat=ParticleVE_%v_%a
WithRecommends=no
Packages=
Packages=acl attr audit authselect bash bash-completion ca-certificates chrony coreutils cryptsetup curl dbus-broker
         dosfstools e2fsprogs efibootmgr erofs-utils fedora-release file findutils fwupd fwupd-efi
         gdisk glibc-minimal-langpack grep hostname particleve hardened_malloc
         integritysetup iproute iputils jq kernel-core kernel-modules kernel-modules-extra keyutils kmod
         linux-firmware amd-ucode-firmware btrfs-progs bubblewrap mdadm microcode_ctl nano nftables node-exporter nvme-cli openssh-server openssh-clients
         openssl pam passwd pciutils polkit policycoreutils procps-ng python3 qemu-img qemu-kvm-core
         libfido2 fido2-tools
         edk2-ovmf swtpm swtpm-tools virtiofsd rpm sbsigntools sed selinux-policy-targeted
          smartmontools systemd systemd-boot systemd-container systemd-networkd
         systemd-pam systemd-resolved systemd-ukify systemd-udev
         tar tpm2-tools tpm2-tss tzdata udisks2 util-linux veritysetup
         wireguard-tools wireless-regdb xz zstd gnupg2
VolatilePackages=
VolatilePackages=systemd systemd-boot systemd-container systemd-networkd systemd-pam systemd-resolved
                 systemd-ukify systemd-udev
InitrdProfiles=
InitrdProfiles=raid
InitrdPackages=particleve-initrd hardened_malloc cryptsetup mdadm btrfs-progs jq tpm2-tools tpm2-tss libfdisk
InitrdVolatilePackages=
InitrdVolatilePackages=systemd systemd-udev
KernelModules=
KernelModules=*
KernelInitrdModules=
KernelInitrdModules=default /drivers/ata/ /drivers/nvme/ /drivers/scsi/ /drivers/md/
                    /drivers/mmc/ /drivers/ufs/ /drivers/virtio/ /drivers/char/tpm/
                    /drivers/usb/storage/ /drivers/usb/host/ /drivers/net/ethernet/ /drivers/char/hw_random/
                    /fs/btrfs/ /fs/erofs/ /crypto/ /arch/x86/crypto/ /drivers/crypto/
                    /net/rfkill/
KernelModulesIncludeHost=no
KernelModulesInitrdIncludeHost=no
MicrocodeHost=no
FirmwareFiles=*
UnifiedKernelImageProfiles=
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial0-9600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial0-19200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial0-38400.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial0-57600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial0-115200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial1-9600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial1-19200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial1-38400.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial1-57600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial1-115200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial2-9600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial2-19200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial2-38400.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial2-57600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial2-115200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial3-9600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial3-19200.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial3-38400.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial3-57600.conf
UnifiedKernelImageProfiles=%D/mkosi.profiles/particleve/console-profiles/serial3-115200.conf
KernelCommandLine=
KernelCommandLine=root=LABEL=ParticleVE-root mount.usr=dissect rw audit=1 audit_backlog_limit=8192 enforcing=1
                  zswap.enabled=1 systemd.gpt_auto=1 systemd.ssh_auto=no kvm_intel.nested=0 kvm_amd.nested=0
                  rfkill.default_state=0 module.sig_enforce=1
                  sysctl.kernel.unprivileged_bpf_disabled=1 sysctl.net.core.bpf_jit_harden=2
                  rd.systemd.mask=systemd-repart.service systemd.mask=systemd-repart.service
                  systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
                  systemd.image_filter=usr=PVE_*:usr-verity=PVE_*:usr-verity-sig=PVE_*
                  console=tty0
RootShell=/bin/bash
RootPassword=hashed:!
Hostname=

[Validation]
SecureBoot=yes
SignExpectedPcr=yes

[Runtime]
Credentials=

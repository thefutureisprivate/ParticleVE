[Unit]
# No listener may start before the management-only packet policy is active.
BindsTo=particleve-firewall.service
PartOf=particleve-firewall.service
After=particleve-firewall.service

[Service]
# Keep Fedora's service account and binary; image policy owns the arguments.
EnvironmentFile=
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=:9100 --no-collector.textfile
CapabilityBoundingSet=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
# The default timex collector reads adjtimex. CAP_SYS_TIME remains absent, so
# clock writes are denied by the kernel; ProtectClock would also deny the read.
SystemCallFilter=@system-service adjtimex
# Deny optional kernel-interface probes without killing the metrics process.
SystemCallErrorNumber=EPERM
LimitCORE=0
UMask=0077

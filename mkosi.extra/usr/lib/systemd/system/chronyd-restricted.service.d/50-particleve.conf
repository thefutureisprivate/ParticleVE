[Unit]
BindsTo=particleve-ca-trust.service
After=particleve-ca-trust.service
PartOf=particleve-ca-trust.service

[Service]
# Use the native restricted NTS client and one reviewed configuration.
EnvironmentFile=
Environment=
Environment=P11_KIT_NO_USER_CONFIG=1
UnsetEnvironment=SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE REQUESTS_CA_BUNDLE
ExecStartPre=/usr/libexec/particleve-nts-trust
ExecStart=
# Refresh before the coordinator's 24-hour NTS-KE age limit. Keep this image
# policy separate from the installation's bound endpoint configuration.
ExecStart=/usr/sbin/chronyd -n -U "include /etc/chrony.conf" "ntsrefresh 43200"

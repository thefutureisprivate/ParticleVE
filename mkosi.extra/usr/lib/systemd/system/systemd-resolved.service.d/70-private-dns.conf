[Unit]
BindsTo=particleve-dns-policy.service
After=particleve-dns-policy.service
PartOf=particleve-dns-policy.service

[Service]
BindReadOnlyPaths=/run/particleve-dns-policy/resolved.conf.d:/run/systemd/resolved.conf.d
BindReadOnlyPaths=/run/particleve-dns-policy/delegates:/run/systemd/dns-delegate.d
BindReadOnlyPaths=/run/particleve-dns-policy/anchors:/run/dnssec-trust-anchors.d

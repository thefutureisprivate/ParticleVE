[Unit]
Requires=particleve-runtime-ready.service systemd-nsresourced.socket
After=particleve-runtime-ready.service systemd-nsresourced.socket
RequiresMountsFor=/var /var/lib/machines
ConditionPathExists=!/run/particleve/vm-start-inhibited

[Service]
# CPU accounting is unconditional on cgroup v2; do not use its deprecated knob.
IOAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
# A kernel OOM is fatal to the VM. Do not leave a partial controller/TPM stack.
OOMPolicy=kill
LimitCORE=0
CoredumpFilter=0
ExecStart=
ExecStart=/usr/libexec/particleve-vm-run %i /usr/bin/systemd-vmspawn --quiet --register=yes --keep-unit --network-tap --pass-ssh-key=no --tpm=no --machine=%i
ExecStartPre=/usr/libexec/particleve-vm-start-guard %i
ExecStop=/usr/libexec/particleve-vm-stop %i
NotifyAccess=all
ExitType=cgroup
TimeoutStartSec=infinity
TimeoutStopSec=infinity
TimeoutAbortSec=infinity
KillMode=mixed
KillSignal=SIGTERM
WatchdogSignal=SIGTERM
SendSIGKILL=no
RuntimeDirectory=particleve-vm/%i
RuntimeDirectoryMode=0700
Environment=TMPDIR=/run/particleve-vm/%i
Environment=PATH=/usr/libexec/particleve-qemu:/usr/libexec/particleve-swtpm:/usr/sbin:/usr/bin
Environment=XDG_CONFIG_HOME=/run/particleve-vm/%i/config
BindPaths=/run/particleve-vm/%i:/tmp
BindPaths=/run/particleve-vm/%i:/var/tmp
# Native setup needs namespace maps, labels, resource limits and capability drops.
# Match the controller's SELinux capability policy; no network administration or ptrace.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_SETFCAP CAP_SETGID CAP_SETPCAP CAP_SETUID CAP_SYS_ADMIN CAP_SYS_RESOURCE
# Host ABI and native network/broker channels; guest ABI is independent. homed
# retains its packaged AF_ALG access and is not covered by this VM-unit policy.
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6 AF_PACKET AF_VSOCK
# Native interactive/read-only consoles allocate a PTY; char-pts alone omits its multiplexer.
DeviceAllow=/dev/ptmx rw

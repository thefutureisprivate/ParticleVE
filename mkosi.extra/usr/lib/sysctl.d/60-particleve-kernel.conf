# The initrd and installed OS use this same policy. Updates/recovery boot via UEFI.
# A single-name glob skips compiled-out kexec without ignoring write failures.
kernel.kexec_load_disable[d] = 1
# Keep trusted systemd BPF available, but lock unprivileged creation off until
# reboot. Reapplying 1 is allowed by the selected kernel's one-way handler.
kernel.unprivileged_bpf_disabled = 1
# Blind JIT constants for privileged programs too. This applies at compilation;
# initrd and host share this early policy rather than changing existing programs.
net.core.bpf_jit_harden = 2
# Tracing remains available to the privileged owner, never an ordinary service.
kernel.yama.ptrace_scope = 2
kernel.kptr_restrict = 2
dev.tty.ldisc_autoload = 0
# Default sealed non-executable memfds; explicit MFD_EXEC remains supported.
vm.memfd_noexec = 1
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
fs.protected_fifos = 2
fs.protected_regular = 2
